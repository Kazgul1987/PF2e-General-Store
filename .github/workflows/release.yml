name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Build and upload Foundry module assets
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout exactly the tag associated with the GitHub Release.
      #
      # Example:
      #   GitHub Release tag: v3.0.8
      # -----------------------------------------------------------------------
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      # -----------------------------------------------------------------------
      # Read module metadata and release tag
      # -----------------------------------------------------------------------
      - name: Read module metadata
        id: module
        shell: bash
        run: |
          set -euo pipefail

          MODULE_ID="$(jq -r '.id' module.json)"
          MODULE_VERSION="$(jq -r '.version' module.json)"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${RELEASE_TAG#v}"

          if [[ -z "$MODULE_ID" || "$MODULE_ID" == "null" ]]; then
            echo "::error::module.json does not contain a valid id."
            exit 1
          fi

          if [[ -z "$MODULE_VERSION" || "$MODULE_VERSION" == "null" ]]; then
            echo "::error::module.json does not contain a valid version."
            exit 1
          fi

          echo "id=$MODULE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          echo "Module:  $MODULE_ID"
          echo "Version: $MODULE_VERSION"
          echo "Tag:     $RELEASE_TAG"

      # -----------------------------------------------------------------------
      # Validate that module.json and the GitHub Release tag agree.
      #
      # Example:
      #   module.json: 3.0.8
      #   release tag: v3.0.8
      # -----------------------------------------------------------------------
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          MODULE_VERSION="${{ steps.module.outputs.version }}"
          TAG_VERSION="${{ steps.module.outputs.tag_version }}"

          if [[ "$MODULE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch!"
            echo "::error::module.json: $MODULE_VERSION"
            echo "::error::release tag: $TAG_VERSION"
            echo
            echo "The release was already published, but assets will not be uploaded."
            echo "Fix module.json/tag version consistency and publish a corrected release."
            exit 1
          fi

          echo "Release tag matches module.json."

      # -----------------------------------------------------------------------
      # Run existing Node regression tests.
      # -----------------------------------------------------------------------
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          if compgen -G "tests/*.test.mjs" > /dev/null; then
            node --test tests/*.test.mjs
          else
            echo "No Node tests found. Skipping."
          fi

      # -----------------------------------------------------------------------
      # Syntax-check all JavaScript source/test files.
      # -----------------------------------------------------------------------
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          FOUND_FILES=0

          while IFS= read -r -d '' file; do
            FOUND_FILES=1
            echo "Checking $file"
            node --check "$file"
          done < <(
            find scripts tests \
              -type f \
              \( -name "*.js" -o -name "*.mjs" \) \
              -print0 2>/dev/null
          )

          if [[ "$FOUND_FILES" -eq 0 ]]; then
            echo "No JavaScript files found to check."
          fi

      # -----------------------------------------------------------------------
      # Validate Foundry manifest URLs and metadata.
      # -----------------------------------------------------------------------
      - name: Validate Foundry manifest
        shell: bash
        run: |
          set -euo pipefail

          MODULE_ID="$(jq -r '.id' module.json)"
          VERSION="$(jq -r '.version' module.json)"
          MANIFEST="$(jq -r '.manifest // empty' module.json)"
          DOWNLOAD="$(jq -r '.download // empty' module.json)"

          if [[ "$MODULE_ID" != "pf2e-general-store" ]]; then
            echo "::error::Unexpected module id: $MODULE_ID"
            exit 1
          fi

          if [[ "$VERSION" != "${{ steps.module.outputs.version }}" ]]; then
            echo "::error::Manifest version mismatch."
            exit 1
          fi

          if [[ -z "$MANIFEST" ]]; then
            echo "::error::module.json has no manifest URL."
            exit 1
          fi

          if [[ -z "$DOWNLOAD" ]]; then
            echo "::error::module.json has no download URL."
            exit 1
          fi

          if [[ "$MANIFEST" != *"/releases/latest/download/module.json" ]]; then
            echo "::warning::Manifest URL does not use releases/latest/download/module.json."
          fi

          if [[ "$DOWNLOAD" != *"/releases/latest/download/pf2e-general-store.zip" ]]; then
            echo "::warning::Download URL does not use releases/latest/download/pf2e-general-store.zip."
          fi

          echo "Foundry manifest looks valid."
          echo "Manifest: $MANIFEST"
          echo "Download: $DOWNLOAD"

      # -----------------------------------------------------------------------
      # Build the Foundry installation ZIP.
      #
      # Important:
      # module.json must be directly at the archive root.
      # -----------------------------------------------------------------------
      - name: Build release ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          MODULE_ID="${{ steps.module.outputs.id }}"
          ZIP_NAME="${MODULE_ID}.zip"

          rm -rf .release
          mkdir -p .release/package

          rsync -av ./ .release/package/ \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".release/" \
            --exclude="tests/" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="*.zip"

          (
            cd .release/package
            zip -r "../${ZIP_NAME}" .
          )

          echo "zip=.release/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

          echo
          echo "Created release archive:"
          ls -lh ".release/${ZIP_NAME}"

      # -----------------------------------------------------------------------
      # Validate archive structure before upload.
      # -----------------------------------------------------------------------
      - name: Validate release ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.package.outputs.zip }}"

          if ! unzip -Z1 "$ZIP" | grep -qx "module.json"; then
            echo "::error::module.json is not located at the root of the ZIP."
            exit 1
          fi

          if ! unzip -Z1 "$ZIP" | grep -qx "scripts/main.js"; then
            echo "::error::scripts/main.js is missing from the ZIP."
            exit 1
          fi

          if unzip -Z1 "$ZIP" | grep -q '^tests/'; then
            echo "::error::tests/ unexpectedly exists in the release ZIP."
            exit 1
          fi

          if unzip -Z1 "$ZIP" | grep -q '^\.github/'; then
            echo "::error::.github/ unexpectedly exists in the release ZIP."
            exit 1
          fi

          echo "Release ZIP structure looks valid."

          echo
          echo "Archive contents:"
          unzip -l "$ZIP"

      # -----------------------------------------------------------------------
      # Upload the generated Foundry ZIP and module.json to the GitHub Release
      # which triggered this workflow.
      #
      # --clobber makes workflow re-runs practical by replacing assets with the
      # same name.
      # -----------------------------------------------------------------------
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ github.event.release.tag_name }}"

          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.zip }}" \
            "module.json" \
            --clobber

      # -----------------------------------------------------------------------
      # Final verification: check that both assets are attached.
      # -----------------------------------------------------------------------
      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ github.event.release.tag_name }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"

          ASSETS="$(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name'
          )"

          echo "Release assets:"
          echo "$ASSETS"

          if ! grep -qx "$ZIP_NAME" <<< "$ASSETS"; then
            echo "::error::$ZIP_NAME was not uploaded to the release."
            exit 1
          fi

          if ! grep -qx "module.json" <<< "$ASSETS"; then
            echo "::error::module.json was not uploaded to the release."
            exit 1
          fi

          echo
          echo "Release assets verified successfully."
